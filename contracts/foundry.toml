# Same compiler settings Asset Tokenization Studio is built with (solc 0.8.28,
# cancun), so bytecode targets the EVM version Hedera runs.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# fixtures: the ATS snapshot the tests load. vectors: signed test vectors
# generated by the TypeScript protocol package. deployments: script output.
fs_permissions = [
  { access = "read", path = "./fixtures" },
  { access = "read", path = "./vectors" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 110
