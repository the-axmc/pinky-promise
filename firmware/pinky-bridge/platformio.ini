; pinky-bridge — build with PlatformIO:
;
;   pio run -e xiao-s3-sense -t upload      device, Seeed XIAO ESP32S3 Sense (camera)
;   pio run -e s3-devkitc -t upload         device, ESP32-S3-DevKitC-1 (no camera)
;   pio run -e anchor-xiao-s3 -t upload     venue anchor on a XIAO ESP32S3
;   pio run -e anchor-s3-devkitc -t upload  venue anchor on a DevKitC
;
; The sketch folder also opens in the Arduino IDE (pinky-bridge/pinky-bridge.ino); choose the
; board and role at the top of config.h there. Wiring and bring-up: docs/hardware.md.

[platformio]
src_dir = pinky-bridge
default_envs = xiao-s3-sense

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  kmackay/micro-ecc@^1.0.0
  mikalhart/TinyGPSPlus@^1.0.3
  sparkfun/SparkFun ATECCX08a Arduino Library@^1.3.1
  adafruit/Adafruit PN532@^1.3.3
  adafruit/Adafruit BusIO@^1.16.1

[env:xiao-s3-sense]
board = seeed_xiao_esp32s3
build_flags =
  ${env.build_flags}
  -DPINKY_BOARD_XIAO_S3_SENSE
  ; -DPINKY_HAS_ENCLOSURE=1   ; once the tamper switch is wired to D0
  ; -DPINKY_HAS_BLE=1         ; reach the anchor over BLE (also set it on the anchor)

[env:s3-devkitc]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DPINKY_BOARD_S3_DEVKITC
  ; -DPIN_LED_RGB=48          ; the on-board RGB LED (38 on v1.1 boards)
  ; -DPINKY_HAS_ENCLOSURE=1
  ; -DPINKY_HAS_BLE=1

[env:s3-eye]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DPINKY_BOARD_S3_EYE
  -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi

[env:anchor-xiao-s3]
board = seeed_xiao_esp32s3
build_flags =
  ${env.build_flags}
  -DPINKY_BOARD_XIAO_S3_SENSE
  -DPINKY_ROLE_ANCHOR
  ; -DPINKY_HAS_BLE=1

[env:anchor-s3-devkitc]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DPINKY_BOARD_S3_DEVKITC
  -DPINKY_ROLE_ANCHOR
  ; -DPINKY_HAS_BLE=1
