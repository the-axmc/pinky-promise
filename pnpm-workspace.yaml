packages:
  - "packages/*"

# pnpm 11 blocks dependency install scripts unless each one is decided here.
allowBuilds:
  # Used by tsx, vite and vitest; its install script fetches the platform binary.
  esbuild: true
  # Optional native accelerators pulled in transitively. Everything works
  # without them (pure-JS fallbacks), so their install scripts stay off.
  bufferutil: false
  es5-ext: false
  msgpackr-extract: false
  utf-8-validate: false
