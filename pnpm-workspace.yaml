packages:
  - "packages/*"

# pnpm blocks dependency install scripts unless they are listed here.
# esbuild (used by tsx, vite and vitest) is the only one we need to build.
onlyBuiltDependencies:
  - esbuild

# Optional native accelerators pulled in transitively. Everything works
# without them (pure-JS fallbacks), so their install scripts stay off.
ignoredBuiltDependencies:
  - bufferutil
  - es5-ext
  - msgpackr-extract
  - utf-8-validate

allowBuilds:
  esbuild: set this to true or false
